      <feDropShadow dx="0" dy="22" stdDeviation="18" flood-color="#1a1a1a" flood-opacity="0.16"/>
    </filter>
    <linearGradient id="purpleBag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a1d6a"/>
